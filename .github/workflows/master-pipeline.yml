name: 🚀 QA Master Pipeline

on:
  push:
    branches: [ main ]

jobs:
  postman-api-tests:
    runs-on: self-hosted
    
    steps:
      - name: 1. Clonar Repositorio
        uses: actions/checkout@v4
        
      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 3. Instalar Newman y Allure Reporter
        run: npm install -g newman newman-reporter-allure
        
      - name: 🧪 4. Ejecutar Pruebas de Postman
        
        run: newman run tests-postman/smoke-test.json -r allure --reporter-allure-export allure-results

      - name: 📊 5. Enviar Resultados a Allure
        if: always()
        run: |
          # Instalamos una herramienta rápida para mandar los resultados
          npm install -g allure-docker-service-cli
          allure-docker-service-cli upload -s http://192.168.18.9:5050 -p default -r allure-results