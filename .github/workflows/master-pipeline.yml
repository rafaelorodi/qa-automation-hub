name: 🚀 QA Master Pipeline

# Quitamos las restricciones de rama para probar
on: [push]

jobs:
  postman-api-tests:
    runs-on: self-hosted
    steps:
      - name: 📥 1. Clonar Repositorio
        uses: actions/checkout@v4
        
      - name: ⚙️ 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 📦 3. Instalar Newman
        run: npm install newman newman-reporter-allure
        
      - name: 🧪 4. Ejecutar Pruebas
        # Usamos npx para asegurar que encuentre el ejecutable
        run: npx newman run tests-postman/smoke-test.json -r allure --reporter-allure-export allure-results || echo "Falló el test pero seguimos"

      - name: 📊 5. Debug de Carpeta
        run: ls -la allure-results/git add .github/workflows/master-pipeline.yml