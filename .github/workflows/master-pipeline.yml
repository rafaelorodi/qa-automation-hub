name: 🚀 QA Master Pipeline (The Final Fix)

on: [push]

jobs:
  qa-automation:
    runs-on: self-hosted
    steps:
      - name: 📥 1. Clonar Repositorio
        uses: actions/checkout@v4
        
      - name: ⚙️ 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ 3. Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 📦 4. Instalar Herramientas
        run: |
          npm install newman newman-reporter-allure
          if [ ! -f karate.jar ]; then
            curl -L https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar -o karate.jar
          fi

      - name: 🧪 5. Ejecutar Postman
        run: |
          npx newman run tests-postman/smoke-test.json \
          -r allure --reporter-allure-export allure-results || echo "Postman falló"

      - name: 🥋 6. Ejecutar Karate y Extraer Reporte
        run: |
          if [ ! -f karate.jar ]; then
            curl -L https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar -o karate.jar
          fi

          # Ejecutamos Karate
          java -jar karate.jar tests-karate/smoke-test.feature -o allure-results/karate-base/
          
          # TRUCO MAESTRO: Buscamos el JSON real que Karate guardó adentro y lo sacamos afuera
          # Karate lo guarda como karate-summary-json.txt, lo movemos y renombramos a .json
          cp allure-results/karate-base/karate-reports/karate-summary-json.txt allure-results/karate-final.json || echo "No se encontró el reporte"
          
          echo "Verificando que el archivo existe ahora:"
          ls -l allure-results/karate-final.json

      - name: 📊 7. Transformar y Enviar a Allure
        if: always()
        run: |
          python3 - << 'EOF'
          import os, base64, requests, json, uuid, time

          results_dir = 'allure-results'
          payload = {'results': []}

          # 1. Procesar archivos existentes (Postman)
          for file in os.listdir(results_dir):
              if file.endswith('-result.json'):
                  with open(os.path.join(results_dir, file), 'rb') as f:
                      payload['results'].append({'file_name': file, 'content_base64': base64.b64encode(f.read()).decode()})

          # 2. TRANSFORMAR KARATE A ALLURE NATIVO
          karate_file = os.path.join(results_dir, 'karate-final.json')
          if os.path.exists(karate_file):
              with open(karate_file, 'r') as f:
                  karate_data = json.load(f)
                  # Creamos un objeto que Allure entienda de una
                  allure_result = {
                      "uuid": str(uuid.uuid4()),
                      "historyId": "karate-smoke-test",
                      "fullName": "Karate: Smoke Test API",
                      "labels": [{"name": "suite", "value": "Karate Framework"}, {"name": "framework", "value": "Karate"}],
                      "name": "Karate API Verification",
                      "status": "passed" if karate_data.get('passed', True) else "failed",
                      "start": int(time.time() * 1000),
                      "stop": int(time.time() * 1000) + 1000
                  }
                  file_name = f"{allure_result['uuid']}-result.json"
                  payload['results'].append({
                      'file_name': file_name,
                      'content_base64': base64.b64encode(json.dumps(allure_result).encode()).decode()
                  })

          # 3. Enviar combo final
          if payload['results']:
              requests.get('http://192.168.18.9:5050/allure-docker-service/clean-results?project_id=default')
              requests.post('http://192.168.18.9:5050/allure-docker-service/send-results?project_id=default', json=payload)
              print(f"✅ Enviados {len(payload['results'])} tests nativos.")
          EOF