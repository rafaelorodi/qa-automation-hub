name: 🚀 QA Master Pipeline (The Final Fix)

on: [push]

jobs:
  qa-automation:
    runs-on: self-hosted
    steps:
      - name: 📥 1. Clonar Repositorio
        uses: actions/checkout@v4
        
      - name: ⚙️ 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ 3. Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 📦 4. Instalar Herramientas
        run: |
          npm install newman newman-reporter-allure
          if [ ! -f karate.jar ]; then
            curl -L https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar -o karate.jar
          fi

      - name: 🧪 5. Ejecutar Postman
        run: |
          npx newman run tests-postman/smoke-test.json \
          -r allure --reporter-allure-export allure-results || echo "Postman falló"

      - name: 🥋 6. Ejecutar y Diagnosticar Karate
        run: |
          # 1. Asegurar que tenemos el JAR
          if [ ! -f karate.jar ]; then
            curl -L https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar -o karate.jar
          fi

          # 2. Ejecutar Karate y capturar TODO el error en un archivo
          echo "Iniciando ejecución de Karate..."
          java -jar karate.jar tests-karate/smoke-test.feature -o allure-results/karate-report.json > karate_output.log 2>&1 || echo "Karate terminó con errores"
          
          # 3. MOSTRAR EL LOG EN GITHUB (Esto es clave para saber por qué falla)
          echo "--- LOG DE KARATE ---"
          cat karate_output.log
          echo "--- FIN DEL LOG ---"

          # 4. Ver si el archivo se creó realmente
          echo "Contenido de allure-results despues de Karate:"
          ls -la allure-results/

      - name: 📊 7. Unificar y Enviar Todo
        if: always()
        run: |
          python3 - << 'EOF'
          import os, base64, requests, json

          payload = {'results': []}
          base_dir = 'allure-results'

          if os.path.exists(base_dir):
              for root, dirs, files in os.walk(base_dir):
                  for file in files:
                      # Agarramos TODO lo que sea .json (Postman + Karate)
                      if file.endswith('.json'):
                          file_path = os.path.join(root, file)
                          with open(file_path, 'rb') as f:
                              content = base64.b64encode(f.read()).decode('utf-8')
                              payload['results'].append({
                                  'file_name': file,
                                  'content_base64': content
                              })

          if payload['results']:
              # Limpiamos antes de enviar
              requests.get('http://localhost:5050/allure-docker-service/clean-results?project_id=default')
              
              url = 'http://localhost:5050/allure-docker-service/send-results?project_id=default'
              r = requests.post(url, json=payload)
              print(f'✅ Enviados {len(payload["results"])} archivos. Status: {r.status_code}')
          EOF