name: 🚀 QA Master Pipeline (Postman + Karate)

on: [push]

jobs:
  qa-automation:
    runs-on: self-hosted
    steps:
      - name: 📥 1. Clonar Repositorio
        uses: actions/checkout@v4
        
      - name: ⚙️ 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ 3. Configurar Java (Para Karate)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 📦 4. Instalar Newman
        run: npm install newman newman-reporter-allure
        
      - name: 🧪 5. Ejecutar Pruebas de Postman
        run: |
          npx newman run tests-postman/smoke-test.json \
          --timeout-request 5000 \
          -r allure \
          --reporter-allure-export allure-results || echo "Postman falló, seguimos..."

      - name: 🥋 6. Ejecutar Pruebas de Karate
        run: |
          # Descargamos el JAR si no existe
          if [ ! -f karate.jar ]; then
            curl -L https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar -o karate.jar
          fi
          
          # Corremos Karate indicando que la salida sea formato Cucumber JSON
          # (Allure Docker Service sabe convertir Cucumber JSON a Allure automáticamente)
          java -jar karate.jar tests-karate/smoke-test.feature -o allure-results/karate-json

      - name: 📊 7. Unificar y Enviar a Allure
        if: always()
        run: |
          python3 - << 'EOF'
          import os, base64, requests, json

          payload = {'results': []}
          
          # 1. Buscamos resultados de Postman (están en la raíz de allure-results)
          postman_dir = 'allure-results'
          if os.path.exists(postman_dir):
              for file in os.listdir(postman_dir):
                  if file.endswith(('-result.json', '-attachment.json', '-attachment.txt')):
                      with open(os.path.join(postman_dir, file), 'rb') as f:
                          content = base64.b64encode(f.read()).decode('utf-8')
                          payload['results'].append({'file_name': file, 'content_base64': content})

          # 2. Buscamos resultados de Karate (están en la subcarpeta)
          karate_dir = 'allure-results/karate-reports'
          if os.path.exists(karate_dir):
              for file in os.listdir(karate_dir):
                  # Karate guarda el JSON importante con extensión .txt o .json
                  if 'karate-json' in file or file.endswith('.json'):
                      with open(os.path.join(karate_dir, file), 'rb') as f:
                          content = base64.b64encode(f.read()).decode('utf-8')
                          payload['results'].append({'file_name': f'karate-{file}', 'content_base64': content})

          if payload['results']:
              # Limpiamos para que el nuevo reporte sea el único y tenga todo
              requests.get('http://localhost:5050/allure-docker-service/clean-results?project_id=default')
              
              url = 'http://localhost:5050/allure-docker-service/send-results?project_id=default'
              headers = {'Content-Type': 'application/json'}
              r = requests.post(url, data=json.dumps(payload), headers=headers)
              print(f'✅ Enviados {len(payload["results"])} archivos en total. Status: {r.status_code}')
          else:
              print('❌ No se encontró nada para enviar.')
          EOF