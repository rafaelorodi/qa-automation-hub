name: 🚀 QA Master Pipeline

# Quitamos las restricciones de rama para probar
on: [push]

jobs:
  postman-api-tests:
    runs-on: self-hosted
    steps:
      - name: 📥 1. Clonar Repositorio
        uses: actions/checkout@v4
        
      - name: ⚙️ 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 📦 3. Instalar Newman
        run: npm install newman newman-reporter-allure
        
      - name: 🧪 4. Ejecutar Pruebas
        # Agregamos --timeout-request para que no se quede colgado 2 minutos si falla
        run: |
          npx newman run tests-postman/smoke-test.json \
          --timeout-request 5000 \
          -r allure \
          --reporter-allure-export allure-results || echo "Tests fallidos, reportando..."

      - name: 📊 5. Enviar Resultados a Allure
        if: always()
        run: |
          python3 -c "
          import os, base64, requests, json
          
          results_dir = 'allure-results'
          allure_url = 'http://localhost:5050/allure-docker-service/send-results?project_id=default'
          
          payload = {'results': []}
          for file in os.listdir(results_dir):
              with open(os.path.join(results_dir, file), 'rb') as f:
                  content = base64.b64encode(f.read()).decode('utf-8')
                  payload['results'].append({'file_name': file, 'content_base64': content})
          
          headers = {'Content-Type': 'application/json'}
          r = requests.post(allure_url, data=json.dumps(payload), headers=headers)
          print(f'Respuesta del servidor: {r.status_code} - {r.text}')
          "