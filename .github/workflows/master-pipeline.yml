name: 🚀 QA Master Pipeline (The Final Fix)

on: [push]

jobs:
  qa-automation:
    runs-on: self-hosted
    steps:
      - name: 📥 1. Clonar Repositorio
        uses: actions/checkout@v4
        
      - name: ⚙️ 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ 3. Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 📦 4. Instalar Herramientas
        run: |
          npm install newman newman-reporter-allure
          if [ ! -f karate.jar ]; then
            curl -L https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar -o karate.jar
          fi

      - name: 🧪 5. Ejecutar Postman
        run: |
          npx newman run tests-postman/smoke-test.json \
          -r allure --reporter-allure-export allure-results || echo "Postman falló"

      - name: 🥋 6. Ejecutar Karate
        run: |
          if [ ! -f karate.jar ]; then
            curl -L https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar -o karate.jar
          fi
          # Generamos el reporte y lo renombramos a .json para que Allure lo reconozca
          java -jar karate.jar tests-karate/smoke-test.feature -o allure-results/
          mv allure-results/karate-summary-json.txt allure-results/karate-report.json || echo "No se pudo renombrar"

      - name: 📊 7. Unificar y Enviar Todo
        if: always()
        run: |
          python3 - << 'EOF'
          import os, base64, requests, json

          payload = {'results': []}
          base_dir = 'allure-results'

          if os.path.exists(base_dir):
              for root, dirs, files in os.walk(base_dir):
                  for file in files:
                      # Ahora incluimos explícitamente el nuevo .json de Karate
                      if file.endswith(('-result.json', '.json')):
                          file_path = os.path.join(root, file)
                          with open(file_path, 'rb') as f:
                              content = base64.b64encode(f.read()).decode('utf-8')
                              payload['results'].append({
                                  'file_name': file,
                                  'content_base64': content
                              })

          if payload['results']:
              # Limpiamos para que no queden rastros de los .txt anteriores
              requests.get('http://localhost:5050/allure-docker-service/clean-results?project_id=default')
              
              url = 'http://localhost:5050/allure-docker-service/send-results?project_id=default'
              r = requests.post(url, json=payload)
              print(f'✅ Enviados {len(payload["results"])} archivos finales. Status: {r.status_code}')
          EOF