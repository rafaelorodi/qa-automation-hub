name: 🚀 QA Master Pipeline (The Final Fix)

on: [push]

jobs:
  qa-automation:
    runs-on: self-hosted
    steps:
      - name: 📥 1. Clonar Repositorio
        uses: actions/checkout@v4
        
      - name: ⚙️ 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ 3. Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 📦 4. Instalar Herramientas
        run: |
          npm install newman newman-reporter-allure
          if [ ! -f karate.jar ]; then
            curl -L https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar -o karate.jar
          fi

      - name: 🧪 5. Ejecutar Postman
        run: |
          mkdir -p allure-results/postman
          npx newman run tests-postman/smoke-test.json \
          -r allure --reporter-allure-export allure-results/postman || echo "Postman falló"

      - name: 🥋 6. Ejecutar Karate
        run: |
          if [ ! -f karate.jar ]; then
            curl -L https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar -o karate.jar
          fi
          mkdir -p allure-results/karate
          java -jar karate.jar tests-karate/smoke-test.feature -o allure-results/karate/ > allure-results/karate_execution.log 2>&1 || echo "Karate falló"

      - name: 🚀 7. Ejecutar Pruebas de Carga (JMeter)
        run: |
          mkdir -p allure-results/jmeter
          ~/jmeter/bin/jmeter -n \
            -t tests-jmeter/prueba_rendimiento.jmx \
            -l allure-results/jmeter/results.jtl \
            -j allure-results/jmeter/jmeter.log \
            -Jjmeter.save.saveservice.output_format=xml \
            || echo "JMeter finalizó"

      - name: 📸 8. Capturar Métricas de Raspberry (CPU y RAM)
        if: always()
        run: |
          sleep 10
          mkdir -p allure-results/metrics
          
          curl -L "http://192.168.18.9:3000/render/d-solo/rYdddlPWk/node-exporter-full?orgId=1&panelId=20&width=1000&height=500&from=now-15m&to=now" \
            -o allure-results/metrics/cpu_usage.png || echo "Fallo captura CPU"
            
          curl -L "http://192.168.18.9:3000/render/d-solo/rYdddlPWk/node-exporter-full?orgId=1&panelId=78&width=1000&height=500&from=now-15m&to=now" \
            -o allure-results/metrics/ram_usage.png || echo "Fallo captura RAM"

      - name: 📊 9. Unificador Maestro (Postman, Karate, JMeter y Métricas)
        if: always()
        run: |
          python3 - << 'EOF'
          import os, base64, requests, json, uuid

          results_dir = 'allure-results'
          payload = {'results': []}

          # 1. Pescar archivos de Postman y Karate
          if os.path.exists(results_dir):
              for root, dirs, files in os.walk(results_dir):
                  for file in files:
                      # Ignoramos png y jtl porque los subiremos a mano
                      if file.endswith(('.json', '.xml', '.txt', '.properties')) and not os.path.isdir(os.path.join(root, file)):
                          with open(os.path.join(root, file), 'rb') as f:
                              content = base64.b64encode(f.read()).decode()
                              payload['results'].append({'file_name': file, 'content_base64': content})

          # 2. Recrear el Ancla de Karate
          karate_uuid = str(uuid.uuid4())
          log_path = os.path.join(results_dir, 'karate_execution.log')
          
          allure_karate = {
              "uuid": karate_uuid,
              "name": "Karate API Detailed Execution",
              "historyId": "karate-independent-test",
              "status": "passed",
              "labels": [{"name": "suite", "value": "Karate Framework"}],
              "attachments": []
          }

          if os.path.exists(log_path):
              log_attachment = f"{karate_uuid}-log.txt"
              with open(log_path, 'rb') as f:
                  payload['results'].append({'file_name': log_attachment, 'content_base64': base64.b64encode(f.read()).decode()})
              allure_karate["attachments"].append({"name": "Karate Log", "source": log_attachment, "type": "text/plain"})

          payload['results'].append({
              'file_name': f"{karate_uuid}-result.json",
              'content_base64': base64.b64encode(json.dumps(allure_karate).encode()).decode()
          })

          # 3. CREAR ANCLA PARA PERFORMANCE Y MÉTRICAS
          perf_uuid = str(uuid.uuid4())
          allure_perf = {
              "uuid": perf_uuid,
              "name": "Resultados JMeter y Métricas de Raspberry",
              "historyId": "performance-metrics-test",
              "status": "passed",
              "labels": [{"name": "suite", "value": "Performance Testing"}],
              "attachments": []
          }

          # Adjuntar archivo de JMeter (.jtl tratado como xml)
          jmeter_path = os.path.join(results_dir, 'jmeter', 'results.jtl')
          if os.path.exists(jmeter_path):
              jmeter_attachment = f"{perf_uuid}-jmeter.xml"
              with open(jmeter_path, 'rb') as f:
                  payload['results'].append({'file_name': jmeter_attachment, 'content_base64': base64.b64encode(f.read()).decode()})
              allure_perf["attachments"].append({"name": "JMeter Results (XML)", "source": jmeter_attachment, "type": "text/xml"})

          # Adjuntar Imagen CPU
          cpu_path = os.path.join(results_dir, 'metrics', 'cpu_usage.png')
          if os.path.exists(cpu_path):
              cpu_attachment = f"{perf_uuid}-cpu.png"
              with open(cpu_path, 'rb') as f:
                  payload['results'].append({'file_name': cpu_attachment, 'content_base64': base64.b64encode(f.read()).decode()})
              allure_perf["attachments"].append({"name": "CPU Usage (Grafana)", "source": cpu_attachment, "type": "image/png"})

          # Adjuntar Imagen RAM
          ram_path = os.path.join(results_dir, 'metrics', 'ram_usage.png')
          if os.path.exists(ram_path):
              ram_attachment = f"{perf_uuid}-ram.png"
              with open(ram_path, 'rb') as f:
                  payload['results'].append({'file_name': ram_attachment, 'content_base64': base64.b64encode(f.read()).decode()})
              allure_perf["attachments"].append({"name": "RAM Usage (Grafana)", "source": ram_attachment, "type": "image/png"})

          # Guardar el ancla de Performance
          payload['results'].append({
              'file_name': f"{perf_uuid}-result.json",
              'content_base64': base64.b64encode(json.dumps(allure_perf).encode()).decode()
          })

          # 4. Limpiar y Enviar TODO junto
          if payload['results']:
              requests.get('http://192.168.18.9:5050/allure-docker-service/clean-results?project_id=default')
              requests.post('http://192.168.18.9:5050/allure-docker-service/send-results?project_id=default', json=payload)
              print(f"✅ Pack Final enviado con {len(payload['results'])} archivos.")
          EOF