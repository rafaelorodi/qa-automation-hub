name: 🚀 QA Master Pipeline (Postman + Karate)

on: [push]

jobs:
  qa-automation:
    runs-on: self-hosted
    steps:
      - name: 📥 1. Clonar Repositorio
        uses: actions/checkout@v4
        
      - name: ⚙️ 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ 3. Configurar Java (Para Karate)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 📦 4. Instalar Newman
        run: npm install newman newman-reporter-allure
        
      - name: 🧪 5. Ejecutar Pruebas de Postman
        run: |
          npx newman run tests-postman/smoke-test.json \
          --timeout-request 5000 \
          -r allure \
          --reporter-allure-export allure-results || echo "Postman falló, seguimos..."

      - name: 🥋 6. Ejecutar Pruebas de Karate
        run: |
          # Descargamos el JAR si no existe
          if [ ! -f karate.jar ]; then
            curl -L https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar -o karate.jar
          fi
          # Corremos Karate. El output se guarda en target/karate-reports
          java -jar karate.jar tests-karate/smoke-test.feature || echo "Karate falló, seguimos..."

      - name: 📊 7. Unificar y Enviar a Allure
        if: always()
        run: |
          python3 - << 'EOF'
          import os, base64, requests, json

          payload = {'results': []}
          # Lista de carpetas donde buscar resultados (Newman y Karate)
          search_dirs = ['allure-results', 'target/karate-reports']

          for d in search_dirs:
              if os.path.exists(d):
                  for file in os.listdir(d):
                      # Buscamos JSONs de Newman y los XML/JSON de Karate
                      if file.endswith(('.json', '.xml')):
                          file_path = os.path.join(d, file)
                          with open(file_path, 'rb') as f:
                              content = base64.b64encode(f.read()).decode('utf-8')
                              payload['results'].append({
                                  'file_name': file,
                                  'content_base64': content
                              })

          if payload['results']:
              url = 'http://localhost:5050/allure-docker-service/send-results?project_id=default'
              headers = {'Content-Type': 'application/json'}
              r = requests.post(url, data=json.dumps(payload), headers=headers)
              print(f'Enviados {len(payload["results"])} archivos. Status: {r.status_code}')
          else:
              print('No se encontraron archivos de resultados.')
          EOF