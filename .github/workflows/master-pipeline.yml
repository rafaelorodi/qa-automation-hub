name: 🚀 QA Master Pipeline (The Final Fix)

on: [push]

jobs:
  qa-automation:
    runs-on: self-hosted
    steps:
      - name: 📥 1. Clonar Repositorio
        uses: actions/checkout@v4
        
      - name: ⚙️ 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ 3. Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 📦 4. Instalar Herramientas
        run: |
          npm install newman newman-reporter-allure
          if [ ! -f karate.jar ]; then
            curl -L https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar -o karate.jar
          fi

      - name: 🧪 5. Ejecutar Postman
        run: |
          npx newman run tests-postman/smoke-test.json \
          -r allure --reporter-allure-export allure-results || echo "Postman falló"

      - name: 🥋 6. Ejecutar Karate y Guardar Log
        run: |
          # Ejecutamos Karate y guardamos el log directamente en allure-results
          java -jar karate.jar tests-karate/smoke-test.feature -o allure-results/karate-base/ > allure-results/execution.log 2>&1 || echo "Check logs"
          
          # Sacamos el JSON para la torta de Allure
          cp allure-results/karate-base/karate-reports/karate-summary-json.txt allure-results/karate-final.json || echo "No summary"

      - name: 📊 7. Transformación Senior Final
        if: always()
        run: |
          python3 - << 'EOF'
          import os, base64, requests, json, uuid, time

          results_dir = 'allure-results'
          payload = {'results': []}

          # 1. Postman
          for file in os.listdir(results_dir):
              if file.endswith('-result.json'):
                  with open(os.path.join(results_dir, file), 'rb') as f:
                      payload['results'].append({'file_name': file, 'content_base64': base64.b64encode(f.read()).decode()})

          # 2. Karate Log (Ahora lo buscamos dentro de la carpeta)
          log_path = os.path.join(results_dir, 'execution.log')
          attachment_name = f"{uuid.uuid4()}-log.txt"
          
          if os.path.exists(log_path) and os.path.getsize(log_path) > 0:
              with open(log_path, 'rb') as f:
                  payload['results'].append({'file_name': attachment_name, 'content_base64': base64.b64encode(f.read()).decode()})
          else:
              # Si por alguna razón no hay log, creamos uno de emergencia
              log_content = "Log no capturado. Revisar consola de GitHub Actions.".encode()
              payload['results'].append({'file_name': attachment_name, 'content_base64': base64.b64encode(log_content).decode()})

          # 3. Resultado Nativo de Allure
          allure_result = {
              "uuid": str(uuid.uuid4()),
              "historyId": "karate-senior-final",
              "fullName": "Karate: API Transaction Logs",
              "labels": [{"name": "suite", "value": "Karate Framework"}, {"name": "severity", "value": "critical"}],
              "name": "Detailed Transaction Log (Debug)",
              "status": "passed",
              "attachments": [{"name": "Karate Full Execution Log", "source": attachment_name, "type": "text/plain"}],
              "start": int(time.time() * 1000),
              "stop": int(time.time() * 1000) + 500
          }
          
          payload['results'].append({
              'file_name': f"{allure_result['uuid']}-result.json",
              'content_base64': base64.b64encode(json.dumps(allure_result).encode()).decode()
          })

          # 4. Enviar
          requests.get('http://192.168.18.9:5050/allure-docker-service/clean-results?project_id=default')
          requests.post('http://192.168.18.9:5050/allure-docker-service/send-results?project_id=default', json=payload)
          EOF