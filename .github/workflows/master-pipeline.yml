name: 🚀 QA Master Pipeline (The Final Fix)

on:
  workflow_dispatch:
    inputs:
      tool:
        description: 'Herramienta a ejecutar'
        required: true
        default: 'Sincronizar Todas'
        type: choice
        options:
          - Playwright
          - Karate
          - Postman
          - JMeter
          - Sincronizar Todas
      test_case:
        description: 'Caso de Prueba'
        required: true
        default: 'inicio_sesion'
        type: string

jobs:
  qa-automation:
    runs-on: self-hosted
    steps:
      - name: 📥 1. Clonar Repositorio
        uses: actions/checkout@v4
        
      - name: ⚙️ 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ 3. Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 📦 4. Instalar Herramientas
        run: |
          # Instalamos FFmpeg para que Playwright pueda grabar videos
          sudo apt-get update && sudo apt-get install -y ffmpeg
          
          # Instalamos las dependencias de Node
          npm install newman newman-reporter-allure allure-playwright @playwright/test playwright
          
          # Descargamos Karate si no existe
          if [ ! -f karate.jar ]; then
            curl -L https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar -o karate.jar
          fi

      - name: 🧪 5. Ejecutar Postman
        if: ${{ github.event.inputs.tool == 'Postman' || github.event.inputs.tool == 'Sincronizar Todas' }}
        run: |
          mkdir -p allure-results/postman
          npx newman run tests-postman/${{ github.event.inputs.test_case }}.json \
          -r allure --reporter-allure-export allure-results/postman || echo "Postman falló"

      - name: 🥋 6. Ejecutar Karate
        if: ${{ github.event.inputs.tool == 'Karate' || github.event.inputs.tool == 'Sincronizar Todas' }}
        run: |
          if [ ! -f karate.jar ]; then
            curl -L https://github.com/karatelabs/karate/releases/download/v1.4.1/karate-1.4.1.jar -o karate.jar
          fi
          mkdir -p allure-results/karate
          java -jar karate.jar tests-karate/${{ github.event.inputs.test_case }}.feature -o allure-results/karate/ > allure-results/karate_execution.log 2>&1 || echo "Karate falló"

      - name: 🎭 7. Ejecutar Playwright Tests
        if: ${{ github.event.inputs.tool == 'Playwright' || github.event.inputs.tool == 'Sincronizar Todas' }}
        run: |
          # 1. Le damos permisos de ejecución obligatorios al binario de Playwright
          chmod -R 755 node_modules/.bin/
          chmod +x node_modules/playwright/cli.js || true
          
          # 2. Instalamos los navegadores
          npx playwright install --with-deps chromium
          
          # 3. Ejecutamos los tests mandando el reporte a Allure
          npx playwright test tests-playwright/${{ github.event.inputs.test_case }}.spec.ts --reporter=line,allure-playwright || echo "Playwright falló"

      - name: 🚀 8. Ejecutar Pruebas de Carga (JMeter)
        if: ${{ github.event.inputs.tool == 'JMeter' || github.event.inputs.tool == 'Sincronizar Todas' }}
        run: |
          mkdir -p allure-results/jmeter
          ~/jmeter/bin/jmeter -n \
            -t tests-jmeter/${{ github.event.inputs.test_case }}.jmx \
            -l allure-results/jmeter/results.jtl \
            -j allure-results/jmeter/jmeter.log \
            -Jjmeter.save.saveservice.output_format=xml \
            || echo "JMeter finalizó"

      - name: 📸 9. Capturar Métricas de Raspberry (CPU y RAM)
        if: always()
        run: |
          sleep 15
          mkdir -p allure-results/metrics
          curl -H "Authorization: Bearer ${{ secrets.GRAFANA_TOKEN }}" \
            -L "http://192.168.18.9:3000/render/d-solo/rYdddlPWk/node-exporter-full?orgId=1&from=now-1h&to=now&panelId=77&width=1200&height=600" \
            -o allure-results/metrics/cpu_usage.png || echo "Fallo captura CPU"
          curl -H "Authorization: Bearer ${{ secrets.GRAFANA_TOKEN }}" \
            -L "http://192.168.18.9:3000/render/d-solo/rYdddlPWk/node-exporter-full?orgId=1&from=now-1h&to=now&panelId=78&width=1200&height=600" \
            -o allure-results/metrics/ram_usage.png || echo "Fallo captura RAM"

      - name: 📊 10. Unificador Maestro (Postman, Karate, Playwright, JMeter y Métricas)
        if: always()
        run: |
          python3 - << 'EOF'
          import os, base64, requests, json, uuid

          results_dir = 'allure-results'
          payload = {'results': []}

          # 1. Pescar TODOS los archivos (Agregamos .webm y .zip)
          if os.path.exists(results_dir):
              for root, dirs, files in os.walk(results_dir):
                  for file in files:
                      # AGREGAMOS .webm (videos) y .zip (trazas) a la lista de abajo
                      allowed_exts = ('.json', '.xml', '.txt', '.properties', '.png', '.jpg', '.webm', '.zip')
                      if file.endswith(allowed_exts) and not os.path.isdir(os.path.join(root, file)):
                          with open(os.path.join(root, file), 'rb') as f:
                              content = base64.b64encode(f.read()).decode()
                              payload['results'].append({'file_name': file, 'content_base64': content})

          # 2. Recrear el Ancla de Karate
          karate_uuid = str(uuid.uuid4())
          log_path = os.path.join(results_dir, 'karate_execution.log')
          allure_karate = {
              "uuid": karate_uuid,
              "name": "Karate API Detailed Execution",
              "historyId": "karate-independent-test",
              "status": "passed",
              "labels": [{"name": "suite", "value": "Karate Framework"}],
              "attachments": []
          }
          if os.path.exists(log_path):
              log_attachment = f"{karate_uuid}-log.txt"
              with open(log_path, 'rb') as f:
                  payload['results'].append({'file_name': log_attachment, 'content_base64': base64.b64encode(f.read()).decode()})
              allure_karate["attachments"].append({"name": "Karate Log", "source": log_attachment, "type": "text/plain"})
          payload['results'].append({'file_name': f"{karate_uuid}-result.json", 'content_base64': base64.b64encode(json.dumps(allure_karate).encode()).decode()})

          # 3. Ancla para Performance y Métricas
          perf_uuid = str(uuid.uuid4())
          allure_perf = {
              "uuid": perf_uuid,
              "name": "Resultados JMeter y Métricas de Raspberry",
              "historyId": "performance-metrics-test",
              "status": "passed",
              "labels": [{"name": "suite", "value": "Performance Testing"}],
              "attachments": []
          }
          jmeter_path = os.path.join(results_dir, 'jmeter', 'results.jtl')
          if os.path.exists(jmeter_path):
              j_att = f"{perf_uuid}-jmeter.xml"
              with open(jmeter_path, 'rb') as f:
                  payload['results'].append({'file_name': j_att, 'content_base64': base64.b64encode(f.read()).decode()})
              allure_perf["attachments"].append({"name": "JMeter Results (XML)", "source": j_att, "type": "text/xml"})
          
          cpu_p = os.path.join(results_dir, 'metrics', 'cpu_usage.png')
          if os.path.exists(cpu_p):
              c_att = f"{perf_uuid}-cpu.png"
              with open(cpu_p, 'rb') as f:
                  payload['results'].append({'file_name': c_att, 'content_base64': base64.b64encode(f.read()).decode()})
              allure_perf["attachments"].append({"name": "CPU Usage (Grafana)", "source": c_att, "type": "image/png"})

          ram_p = os.path.join(results_dir, 'metrics', 'ram_usage.png')
          if os.path.exists(ram_p):
              r_att = f"{perf_uuid}-ram.png"
              with open(ram_p, 'rb') as f:
                  payload['results'].append({'file_name': r_att, 'content_base64': base64.b64encode(f.read()).decode()})
              allure_perf["attachments"].append({"name": "RAM Usage (Grafana)", "source": r_att, "type": "image/png"})

          payload['results'].append({'file_name': f"{perf_uuid}-result.json", 'content_base64': base64.b64encode(json.dumps(allure_perf).encode()).decode()})

          # 4. Limpiar y Enviar TODO junto
          if payload['results']:
              requests.get('http://192.168.18.9:5050/allure-docker-service/clean-results?project_id=default')
              requests.post('http://192.168.18.9:5050/allure-docker-service/send-results?project_id=default', json=payload)
              print(f"✅ Pack Final enviado con {len(payload['results'])} archivos.")
          EOF