name: 🚀 QA Master Pipeline

# Quitamos las restricciones de rama para probar
on: [push]

jobs:
  postman-api-tests:
    runs-on: self-hosted
    steps:
      - name: 📥 1. Clonar Repositorio
        uses: actions/checkout@v4
        
      - name: ⚙️ 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 📦 3. Instalar Newman
        run: npm install newman newman-reporter-allure
        
      - name: 🧪 4. Ejecutar Pruebas
        # Agregamos --timeout-request para que no se quede colgado 2 minutos si falla
        run: |
          npx newman run tests-postman/smoke-test.json \
          --timeout-request 5000 \
          -r allure \
          --reporter-allure-export allure-results || echo "Tests fallidos, reportando..."

      - name: 📊 5. Enviar Resultados a Allure
        if: always()
        run: |
          echo "Enviando resultados a Allure Docker..."
          # Este es un método simple: comprimimos y mandamos por CURL
          cd allure-results && tar -czf results.tar.gz *
          curl -X POST "http://localhost:5050/allure-docker-service/send-results?project_id=default" \
          -H "accept: */*" -H "Content-Type: application/json" \
          -d "{\"results\": [{\"file_name\": \"results.tar.gz\", \"content_base64\": \"$(base64 -w 0 results.tar.gz)\"}]}"