name: QA Tests - Selectable HUs

on:
  workflow_dispatch:
    inputs:
      playwright_hus:
        description: 'Playwright HUs to run (comma-separated: HU001,HU002,HU003)'
        required: false
        default: 'HU001'
      karate_hus:
        description: 'Karate HUs to run (comma-separated: HU001,HU002,HU003)'
        required: false
        default: 'HU001'
  push:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: Get Playwright HUs
        id: pw_hus
        run: |
          HUS="${{ github.event.inputs.playwright_hus || 'HU001' }}"
          echo "test_dirs=$(echo $HUS | sed 's/,/|/g')" >> $GITHUB_OUTPUT
      
      - name: Run Playwright Tests
        run: |
          npm run test:playwright -- tests-playwright/HU001_Login tests-playwright/HU002_Products
        if: success()
      
      - name: Run Karate Tests
        run: |
          npx karate tests-karate/HU001_Login/smoke-test.feature
        if: success()
      
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: allure-results
          path: allure-results/
